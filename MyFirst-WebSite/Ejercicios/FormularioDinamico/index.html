<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario Dinámico</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <header>
    <h1>Formulario Dinámico</h1>
    <p>Selecciona una categoría y completa los campos correspondientes.</p>
  </header>

  <main>
    <section>
      <form id="dynamicForm">
        <fieldset>
          <legend>Datos Generales</legend>

          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" required />

          <label for="email">Correo electrónico:</label>
          <input type="email" id="email" name="email" required />
        </fieldset>

        <fieldset>
          <legend>Selecciona una categoría</legend>
          <label for="categoria">Categoría:</label>
          <select id="categoria" name="categoria" required>
            <option value="">Selecciona...</option>
            <option value="libros">Libros</option>
            <option value="peliculas">Películas</option>
            <option value="musica">Música</option>
          </select>
        </fieldset>

        <section id="camposAdicionales"></section>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2025 Formulario Dinámico | Ejemplo educativo</p>
  </footer>

  <script src="./js/scripts.js"></script>
</body>
</html>
