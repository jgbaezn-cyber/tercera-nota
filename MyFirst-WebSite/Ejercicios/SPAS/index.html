<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>SPA Semántica con HTML y ARIA</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f5f7fa;
        color: #333;
      }

      header {
        background: #2a9d8f;
        color: white;
        padding: 1em;
      }

      nav ul {
        list-style: none;
        display: flex;
        gap: 1.5em;
        justify-content: center;
        padding: 0;
      }

      nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
      }

      nav a:hover {
        text-decoration: underline;
      }

      main {
        padding: 2em;
        text-align: center;
      }

      main img {
        margin-top: 1.5em;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      }

      footer {
        background: #264653;
        color: white;
        text-align: center;
        padding: 1em;
        position: fixed;
        bottom: 0;
        width: 100%;
      }

      h1 {
        color: #264653;
      }
    </style>
  </head>

  <body>
    <header role="banner">
      <nav role="navigation" aria-label="Menú principal">
        <ul>
          <li><a href="#home" onclick="loadHome()">Inicio</a></li>
          <li><a href="#about" onclick="loadAbout()">Sobre Nosotros</a></li>
          <li><a href="#contact" onclick="loadContact()">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main role="main" id="mainContent" tabindex="-1">
      <h1>Bienvenido a la página de SPA</h1>
      <p>Usa el menú de navegación para cambiar de sección sin recargar la página.</p>
      
      <img src="https://areajugones.sport.es/wp-content/uploads/2023/02/titanes-de-los-muros-2.jpg" 
           alt="Ejemplo ilustrativo de una aplicación web"
           width="800">
    </main>

    <footer role="contentinfo">
      <p>© 2025 SPA Semántica. Todos los derechos reservados.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
