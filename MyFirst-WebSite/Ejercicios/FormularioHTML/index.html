<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario de Registro HTML</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    form {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
      width: 360px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      margin-top: 15px;
      cursor: pointer;
      transition: background 0.3s;
      padding: 10px;
      width: 100%;
      border-radius: 5px;
    }

    button:hover {
      background-color: #0056b3;
    }

    .radio-group,
    .checkbox-group {
      margin-top: 10px;
    }

    .radio-option,
    .checkbox-option {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
    }

    .radio-option label,
    .checkbox-option label {
      font-weight: normal;
      margin: 0;
    }

    .terms {
      display: flex;
      align-items: center;
      margin-top: 15px;
      gap: 6px;
    }

    .terms label {
      font-weight: normal;
    }
  </style>
</head>
<body>
  <form id="registrationForm" action="#" method="post">
    <h2>Registro de Usuario</h2>

    <label for="fullName">Nombre completo:</label>
    <input type="text" id="fullName" name="fullName" required />

    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" required />

    <label for="password">Contraseña:</label>
    <input
      type="password"
      id="password"
      name="password"
      pattern=".{8,}"
      title="Debe tener al menos 8 caracteres"
      required
    />

    <label for="dob">Fecha de nacimiento:</label>
    <input type="date" id="dob" name="dob" />

    <label for="country">País:</label>
    <select id="country" name="country">
      <option value="">Seleccione...</option>
      <option value="usa">Estados Unidos</option>
      <option value="canada">Canadá</option>
      <option value="mexico">México</option>
      <option value="colombia">Colombia</option>
    </select>

    <div class="radio-group">
      <label>Género:</label>
      <div class="radio-option">
        <input type="radio" id="male" name="gender" value="male" />
        <label for="male">Masculino</label>
      </div>
      <div class="radio-option">
        <input type="radio" id="female" name="gender" value="female" />
        <label for="female">Femenino</label>
      </div>
    </div>

    <div class="checkbox-group">
      <label>Intereses:</label>
      <div class="checkbox-option">
        <input type="checkbox" id="coding" name="interests" value="coding" />
        <label for="coding">Programación</label>
      </div>
      <div class="checkbox-option">
        <input type="checkbox" id="music" name="interests" value="music" />
        <label for="music">Música</label>
      </div>
      <div class="checkbox-option">
        <input type="checkbox" id="sports" name="interests" value="sports" />
        <label for="sports">Deportes</label>
      </div>
    </div>

    <div class="terms">
      <input type="checkbox" id="terms" name="terms" required />
      <label for="terms">Acepto los términos y condiciones</label>
    </div>

    <button type="submit">Registrarse</button>
  </form>

  <script>
    document
      .getElementById("registrationForm")
      .addEventListener("submit", function (event) {
        if (!this.checkValidity()) {
          event.preventDefault();
          alert(
            "Por favor, completa correctamente todos los campos obligatorios."
          );
        } else {
          alert("¡Registro exitoso!");
        }
      });
  </script>
</body>
</html>
